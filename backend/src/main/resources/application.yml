spring:
  application:
    name: goalpilot
  autoconfigure:
    # MySQL is intentionally not configured until the next implementation step.
    # Keeping the dependency now lets the project structure stay stable while
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info

goalpilot:
  agent:
    model: ${}
