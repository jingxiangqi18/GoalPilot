spring:
  application:
    name: goalpilot

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goalpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  ai:
    model:
      chat: openai

    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      timeout: ${DEEPSEEK_TIMEOUT:180s}

      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:goalpilot}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
